; VibeCYD – Claude-Usage-Display für das ESP32 "Cheap Yellow Display" (ESP32-2432S028R)
;
; cyd      : klassisches CYD (1x Micro-USB, ILI9341)
; cyd2usb  : CYD mit 2 USB-Ports (Micro-USB + USB-C) – braucht invertierte Farben

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:cyd]
build_flags =
    ${env.build_flags}
    -DDISPLAY_INVERT=0

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DDISPLAY_INVERT=1
